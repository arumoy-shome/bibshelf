[project]
name = "bibshelf"
version = "0.1.0"
description = "Shelve a paper or a book: fetch its bibtex, file its pdf"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Arumoy Shome", email = "contact@arumoy.me" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["bibtex", "bibliography", "doi", "arxiv", "isbn", "reference-manager"]
# NOTE: no "License ::" classifier. The license is declared as an SPDX
# expression above, and PyPI rejects a distribution that carries both.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/arumoy-shome/bibshelf"
Issues = "https://github.com/arumoy-shome/bibshelf/issues"

[project.scripts]
bs = "bibshelf:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
